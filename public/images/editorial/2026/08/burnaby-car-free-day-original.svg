<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- Sky -->
  <rect width="800" height="300" fill="#81d4fa"/>
  <!-- Road -->
  <rect y="300" width="800" height="200" fill="#455a64"/>
  <!-- Road lines -->
  <rect x="50" y="380" width="700" height="8" fill="#ffeb3b"/>
  <rect x="50" y="410" width="700" height="8" fill="#ffeb3b"/>
  <!-- Closed barrier -->
  <rect x="350" y="250" width="100" height="20" fill="#d32f2f" rx="5"/>
  <text x="400" y="265" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">ROAD CLOSED</text>
  <!-- Bicycle -->
  <circle cx="200" cy="420" r="35" fill="#fff" stroke="#263238" stroke-width="12"/>
  <circle cx="320" cy="420" r="35" fill="#fff" stroke="#263238" stroke-width="12"/>
  <line x1="215" y1="390" x2="305" y2="390" stroke="#263238" stroke-width="12"/>
  <polygon points="180,380 220,360 250,390" fill="#d32f2f"/>
  <!-- People -->
  <circle cx="500" cy="340" r="25" fill="#ff9800"/>
  <rect x="480" y="365" width="40" height="60" fill="#ff9800" rx="5"/>
  <circle cx="620" cy="340" r="25" fill="#4fc3f7"/>
  <rect x="600" y="365" width="40" height="60" fill="#4fc3f7" rx="5"/>
  <!-- Banner -->
  <rect x="100" y="150" width="600" height="80" fill="#d32f2f" rx="10"/>
  <text x="400" y="200" text-anchor="middle" fill="#fff" font-size="42" font-weight="bold">CAR FREE DAY</text>
  <text x="400" y="235" text-anchor="middle" fill="#fff" font-size="22">AUG 30 • EDMONDS ST • FREE FESTIVAL</text>
  <!-- Trees -->
  <rect x="50" y="220" width="20" height="100" fill="#2e7d32"/>
  <circle cx="60" cy="200" r="40" fill="#2e7d32"/>
  <rect x="720" y="220" width="20" height="100" fill="#2e7d32"/>
  <circle cx="730" cy="200" r="40" fill="#2e7d32"/>
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#263238" font-size="28" font-weight="bold">Burnaby Car Free Day - Aug 30</text>

