name: IndexNow Ping

on:
  push:
    branches: [main]
    paths:
      - 'content/**/*.mdx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-${{ github.sha }}
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Public by design: served at https://www.trendstoday.ca/<key>.txt
      INDEXNOW_KEY: 7ca86737e2d21d13797d1f17aec2f1b6

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Find changed article files
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          else
            BASE="HEAD~1"
          fi
          git diff --name-only --diff-filter=AMR "$BASE" HEAD -- 'content/**/*.mdx' > changed-files.txt || true
          echo "Changed article files since $BASE:"
          cat changed-files.txt

      - name: Wait for deploy and ping IndexNow
        continue-on-error: true
        run: xargs -a changed-files.txt node scripts/indexnow-ping.mjs
