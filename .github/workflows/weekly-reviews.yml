name: Weekly Content Business Scorecard

on:
  schedule:
    # Run every Monday. This workflow measures; it never publishes or deploys.
    - cron: '0 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-scorecard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build repository scorecard
        run: >-
          python apps/pipeline/scorecard.py
          --output reports/editorial/weekly-scorecard.json

      - name: Upload scorecard
        uses: actions/upload-artifact@v4
        with:
          name: trends-today-weekly-scorecard
          path: reports/editorial/weekly-scorecard.json
          if-no-files-found: error
          retention-days: 30
