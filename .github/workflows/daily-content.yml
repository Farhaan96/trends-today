name: Daily Content Opportunity Research

on:
  schedule:
    # Research daily. This workflow never publishes or deploys.
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

jobs:
  research-opportunities:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependency
        run: python -m pip install requests python-dotenv

      - name: Build evidence queue
        run: >-
          python apps/pipeline/runner.py research --limit 15
          --output reports/editorial/research-queue.json

      - name: Upload research queue
        uses: actions/upload-artifact@v4
        with:
          name: trends-today-research-queue
          path: reports/editorial/research-queue.json
          if-no-files-found: error
          retention-days: 14
